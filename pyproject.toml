[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = [
  "filprofiler >= 2024.11.2",
  "numpy >= 2, < 3",
  "pyinstrument >= 5, < 6",
]
description = "Profile CPU and memory usage of Python code."
homepage = "https://github.com/shuuchuu/performance"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "performance"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "pyrefly >= 1.4",
  "ruff >= 0.17",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Without a config, pyrefly falls back to its lenient "basic" preset. With one,
# it stops treating the project root as an import root, so tests couldn't
# import tests.conftest without search-path.
[tool.pyrefly]
search-path = ["."]
